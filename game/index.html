<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --good-bg:#143428;--bad-bg:#3B1E1B;--info-bg:#17283F;color-scheme:dark}}

  --bg:#0F151C;--surface:#17202A;--surface2:#1D2833;--ink:#E7ECF2;--muted:#9AA8B8;--line:#2C3947;

ul.clean{margin:0;padding-left:1.2em}ul.clean li{margin:.25em 0}
dl.gl{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:8px 16px;margin:0}

@media(max-width:620px){dl.gl{grid-template-columns:1fr}dl.gl dt{margin-top:6px}}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;counter-reset:s}

<script>
/* ===== CORE: seeded data + real computation (no hard-coded answers) ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeRng(seed){
  const r=mulberry32(seed>>>0);
  const o={
    u:()=>r(),
    n:()=>{let u=0;while(u===0)u=r();const v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)},
    int:(a,b)=>a+Math.floor(r()*(b-a+1)),
    range:(a,b)=>a+(b-a)*r()
  };
  return o;
}
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const variance=a=>{const m=mean(a);return a.reduce((s,x)=>s+(x-m)*(x-m),0)/Math.max(1,a.length-1)};
const sd=a=>Math.sqrt(variance(a));
const median=a=>{const b=[...a].sort((x,y)=>x-y),h=b.length>>1;return b.length%2?b[h]:(b[h-1]+b[h])/2};
const clamp=(x,lo,hi)=>Math.max(lo,Math.min(hi,x));
const newSeed=()=>Math.floor(Math.random()*4294967295);

/* ---------- Case 1: sampling ---------- */
const L1_ROUNDS=[
  {name:'Riverside City',unit:'min',budget:150,N:3000,
   brief:'The transport office wants the average one-way commute time of all 3,000 residents of Riverside. You have a survey budget of 150 interviews.',
   groups:[{n:'Town centre',share:.30,m:18,s:7},{n:'Suburbs',share:.45,m:34,s:10},{n:'Rural edge',share:.25,m:52,s:14}],
   station:0},
  {name:'Hillside County',unit:'min',budget:60,N:3000,
   brief:'Next client: Hillside County. Budget is tighter, 60 interviews. Commutes differ a lot between the valley towns and the hill villages.',
   groups:[{n:'Valley towns',share:.50,m:22,s:8},{n:'Mid-slope',share:.30,m:38,s:11},{n:'Hill villages',share:.20,m:63,s:16}],
   station:0},
  {name:'Harbour District',unit:'min',budget:40,N:3000,
   brief:'Last survey: Harbour District. Only 40 interviews. A small group of residents commute by ferry from the outer islands, and the council cares about them.',
   groups:[{n:'Dockside',share:.52,m:20,s:7},{n:'Inland',share:.42,m:36,s:11},{n:'Ferry islands',share:.06,m:80,s:18}],
   station:0}
];
const L1_METHODS=[
  {id:'station',name:'Station intercepts',desc:'Stand at the central train station and interview whoever walks past.'},
  {id:'poll',name:'Open online poll',desc:'Post a link on the council website. Anyone who wants to can answer.'},
  {id:'random',name:'Random draw',desc:'Pick residents completely at random from the city register.'},
  {id:'strat',name:'Stratified draw',desc:'Split the register by neighbourhood, then draw at random inside each one.'}
];
function l1Population(cfg,rng){
  const pop=[];
  cfg.groups.forEach((g,gi)=>{
    const k=Math.round(cfg.N*g.share);
    for(let i=0;i<k;i++)pop.push({g:gi,y:Math.max(3,Math.round(g.m+g.s*rng.n()))});
  });
  const idx=pop.map(()=>0);
  const byG=cfg.groups.map((_,gi)=>pop.map((p,i)=>p.g===gi?i:-1).filter(i=>i>=0));
  return {pop,byG,ys:pop.map(p=>p.y),trueMean:mean(pop.map(p=>p.y)),popSD:sd(pop.map(p=>p.y)),ymax:Math.max(...pop.map(p=>p.y))};
}
function drawIdx(arr,n,rng){ // sample n without replacement
  const a=arr.slice(),m=Math.min(n,a.length);
  for(let i=0;i<m;i++){const j=i+Math.floor(rng.u()*(a.length-i));const t=a[i];a[i]=a[j];a[j]=t}
  return a.slice(0,m);
}
function l1Sample(P,cfg,method,n,rng){
  const pop=P.pop;let idx=[];
  if(method==='random'){idx=drawIdx(pop.map((_,i)=>i),n,rng)}
  else if(method==='station'){
    const seen=new Set();let guard=0;
    while(idx.length<n&&guard++<n*50){
      const i=rng.u()<.85?P.byG[cfg.station][Math.floor(rng.u()*P.byG[cfg.station].length)]:Math.floor(rng.u()*pop.length);
      if(!seen.has(i)){seen.add(i);idx.push(i)}
    }
  }else if(method==='poll'){
    const seen=new Set();let guard=0;
    while(idx.length<n&&guard++<n*400){
      const i=Math.floor(rng.u()*pop.length);
      if(seen.has(i))continue;
      if(rng.u()<Math.pow(pop[i].y/P.ymax,2)){seen.add(i);idx.push(i)}
    }
  }else if(method==='strat'){
    const k=cfg.groups.length;
    let alloc=cfg.groups.map(g=>Math.max(2,Math.round(n*g.share)));
    let tot=alloc.reduce((s,x)=>s+x,0);
    while(tot>n){let mi=0;alloc.forEach((a,i)=>{if(a>alloc[mi])mi=i});alloc[mi]--;tot--}
    while(tot<n){let mi=0;alloc.forEach((a,i)=>{if(a/cfg.groups[i].share<alloc[mi]/cfg.groups[mi].share)mi=i});alloc[mi]++;tot++}
    const parts=[];
    for(let gi=0;gi<k;gi++){const ii=drawIdx(P.byG[gi],alloc[gi],rng);idx.push(...ii);parts.push(ii.map(i=>pop[i].y))}
    const est=parts.reduce((s,p,gi)=>s+cfg.groups[gi].share*mean(p),0);
    const se=Math.sqrt(parts.reduce((s,p,gi)=>s+Math.pow(cfg.groups[gi].share,2)*variance(p)/p.length,0));
    return {est,se,idx,alloc};
  }
  const ys=idx.map(i=>pop[i].y);
  return {est:mean(ys),se:sd(ys)/Math.sqrt(ys.length),idx};
}
function l1Run(P,cfg,method,n,seed){
  const rng=makeRng(seed);
  const one=l1Sample(P,cfg,method,n,rng);
  const reps=[];
  for(let r=0;r<400;r++)reps.push(l1Sample(P,cfg,method,n,rng).est);
  const bias=mean(reps)-P.trueMean,sdEst=sd(reps),rmse=Math.sqrt(bias*bias+sdEst*sdEst);
  const score=Math.round(100*clamp(1-rmse/(0.35*P.popSD),0,1));
  const groupsSeen=cfg.groups.map((g,gi)=>one.idx.filter(i=>P.pop[i].g===gi).length);
  return {one,reps,bias,sdEst,rmse,score,groupsSeen,
    ciLo:one.est-1.96*one.se,ciHi:one.est+1.96*one.se,
    covers:Math.abs(one.est-P.trueMean)<=1.96*one.se};
}

/* ---------- Case 2: outliers (OLS on included points) ---------- */
const L2_ROUNDS=[
  {name:'Maple Street',invest:2,noise:20,n:20,
   brief:'A buyer asks: how much extra does each additional square metre of floor area add to a house price in this neighbourhood? You have 20 recent sales. One looks odd.',
   odd:[{k:'typo_price'}]},
  {name:'Cedar Heights',invest:3,noise:24,n:22,
   brief:'Second client, new neighbourhood. Two sales stand out from the rest. You can check the paperwork on three listings before you decide.',
   odd:[{k:'typo_area'},{k:'mansion'}]},
  {name:'Old Harbour',invest:3,noise:26,n:24,
   brief:'Hardest file yet. Four sales look unusual and you can only check three. Removing real data costs accuracy; keeping bad data costs it too.',
   odd:[{k:'typo_price'},{k:'family'},{k:'mansion'},{k:'auction'}]}
];
function l2Data(cfg,rng){
  const A=40,B=2.2;const pts=[];
  const f=x=>A+B*x;
  for(let i=0;i<cfg.n-cfg.odd.length;i++){
    const x=Math.round(rng.range(60,200));
    pts.push({x,y:Math.round(f(x)+cfg.noise*rng.n()),kind:'ok',note:'Open-market sale. Price and floor area match the land registry.'});
  }
  cfg.odd.forEach(o=>{
    let x=Math.round(rng.range(70,190)),y=Math.round(f(x)+cfg.noise*0.6*rng.n()),kind='ok',note='';
    if(o.k==='typo_price'){const t=y;y=Math.round(t/10);kind='bad';note='Registry shows a sale at $'+t+'k. The listing was keyed as $'+y+'k (a digit was dropped). This is a data-entry error.'}
    if(o.k==='typo_area'){const t=x;x=Math.round(t/10);kind='bad';note='Registry shows '+t+' m². The listing was keyed as '+x+' m² (a digit was dropped). This is a data-entry error.'}
    if(o.k==='mansion'){x=Math.round(rng.range(330,380));y=Math.round(f(x)+cfg.noise*0.5*rng.n());kind='ok';note='A very large estate, but the sale is verified in the registry. It is unusual, not wrong.'}
    if(o.k==='family'){const t=y;y=Math.round(t*0.42);kind='bad';note='Sold between siblings at a family discount (about 58% below market). Not an open-market price.'}
    if(o.k==='auction'){y=Math.round(f(x)+cfg.noise*2.6);kind='ok';note='Verified open auction with several bidders. A high price, but a genuine market price.'}
    pts.push({x,y,kind,note});
  });
  pts.forEach((p,i)=>p.id=i+1);
  // shuffle display order is irrelevant; keep ids
  return {pts,A,B};
}
function ols(xs,ys){
  const n=xs.length;if(n<2)return null;
  const mx=mean(xs),my=mean(ys);let sxx=0,sxy=0,syy=0;
  for(let i=0;i<n;i++){sxx+=(xs[i]-mx)**2;sxy+=(xs[i]-mx)*(ys[i]-my);syy+=(ys[i]-my)**2}
  if(sxx===0)return null;
  const b=sxy/sxx,a=my-b*mx;
  return {a,b,r2:syy===0?0:sxy*sxy/(sxx*syy),n};
}
function l2Score(D,removed){
  const inc=D.pts.filter(p=>!removed.has(p.id));
  const fit=ols(inc.map(p=>p.x),inc.map(p=>p.y));
  const wrong=D.pts.filter(p=>removed.has(p.id)&&p.kind==='ok').length;
  const missed=D.pts.filter(p=>!removed.has(p.id)&&p.kind==='bad').length;
  const accuracy=fit?clamp(100*(1-Math.abs(fit.b-D.B)/(0.3*D.B)),0,100):0;
  const score=Math.round(clamp(accuracy-12*wrong-15*missed,0,100));
  return {fit,wrong,missed,accuracy:Math.round(accuracy),score};
}

/* ---------- Case 3: polynomial fit / overfitting ---------- */
const L3_ROUNDS=[
  {name:'Seasonal demand',n:30,noise:0.9,lo:0,hi:10,xl:'Week',yl:'Demand',
   f:x=>2*Math.sin(x/2.2)+0.3*x,
   brief:'Forecast weekly demand for a product with a gentle seasonal wiggle. You have 30 weeks of noisy history. Pick how flexible the forecasting curve should be.'},
  {name:'Fuel use',n:18,noise:1.3,lo:0,hi:10,xl:'Speed',yl:'Fuel use',
   f:x=>0.28*(x-5)**2+1,
   brief:'Model how fuel use depends on speed. Only 18 test drives, and the readings are noisy.'},
  {name:'Plant growth',n:12,noise:2.0,lo:0,hi:10,xl:'Light',yl:'Growth',
   f:x=>0.6*x+1,
   brief:'A biology lab has just 12 plants, and the measurements are very noisy. Choose a model that will predict the next batch.'}
];
function l3Data(cfg,rng){
  const mk=m=>{const xs=[],ys=[];for(let i=0;i<m;i++){const x=rng.range(cfg.lo,cfg.hi);xs.push(x);ys.push(cfg.f(x)+cfg.noise*rng.n())}return {xs,ys}};
  const tr=mk(cfg.n),te=mk(300);
  // fixed order so the first k are "train" when holding out
  return {tr,te};
}
function legendre(t,d){const P=[1,t];for(let k=1;k<d;k++)P.push(((2*k+1)*t*P[k]-k*P[k-1])/(k+1));return P.slice(0,d+1)}
function solve(A,b){
  const n=b.length,M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){
    let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;
    [M[c],M[p]]=[M[p],M[c]];
    const d=M[c][c]||1e-12;
    for(let r=c+1;r<n;r++){const f=M[r][c]/d;for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k]}
  }
  const x=new Array(n).fill(0);
  for(let r=n-1;r>=0;r--){let s=M[r][n];for(let k=r+1;k<n;k++)s-=M[r][k]*x[k];x[r]=s/(M[r][r]||1e-12)}
  return x;
}
function polyFit(xs,ys,deg,lo,hi){
  const t=x=>2*(x-lo)/(hi-lo)-1,m=deg+1;
  const AtA=Array.from({length:m},()=>new Array(m).fill(0)),Aty=new Array(m).fill(0);
  for(let i=0;i<xs.length;i++){const r=legendre(t(xs[i]),deg);for(let a=0;a<m;a++){Aty[a]+=r[a]*ys[i];for(let b=0;b<m;b++)AtA[a][b]+=r[a]*r[b]}}
  for(let a=0;a<m;a++)AtA[a][a]+=1e-9;
  const c=solve(AtA,Aty);
  return x=>{const r=legendre(t(x),deg);let s=0;for(let a=0;a<m;a++)s+=c[a]*r[a];return s};
}
const rmse=(f,xs,ys)=>Math.sqrt(mean(xs.map((x,i)=>(f(x)-ys[i])**2)));
function l3Eval(cfg,D,holdout,maxDeg){
  const n=D.tr.xs.length,k=holdout?Math.round(n*0.25):0,nt=n-k;
  const trX=D.tr.xs.slice(0,nt),trY=D.tr.ys.slice(0,nt),vaX=D.tr.xs.slice(nt),vaY=D.tr.ys.slice(nt);
  const rows=[];
  for(let d=1;d<=maxDeg;d++){
    const f=polyFit(trX,trY,d,cfg.lo,cfg.hi);
    rows.push({d,train:rmse(f,trX,trY),val:k?rmse(f,vaX,vaY):null,test:rmse(f,D.te.xs,D.te.ys),f});
  }
  const best=rows.reduce((a,b)=>b.test<a.test?b:a);
  return {rows,best,trX,trY,vaX,vaY};
}
function l3Score(ev,d){
  const r=ev.rows[d-1];
  return Math.round(100*clamp(1-(r.test-ev.best.test)/ev.best.test,0,1));
}

/* ---------- Case 4: correlation vs causation (OLS with controls) ---------- */
const L4_ROUNDS=[
  {name:'Beach town',N:300,
   X:{k:'x',n:'Ice cream sales',u:'cones/day'},Y:{k:'y',n:'Beach rescues',u:'per day'},
   brief:'The mayor sees that ice cream sales and beach rescues rise together across 300 summer days, and wants to ban ice cream stands on the beach. You can check other recorded variables before you advise.',
   C:[{k:'temp',n:'Temperature',u:'°C'},{k:'wind',n:'Wind speed',u:'km/h'},{k:'wd',n:'Day of week (weekend = 1)',u:''}],
   good:['temp'],
   gen(r){const o=[];for(let i=0;i<300;i++){const temp=24+5*r.n(),wind=15+6*r.n(),wd=r.u()<2/7?1:0;
     const x=150+12*(temp-24)+35*r.n(),y=6+0.3*(temp-24)+0.8*r.n();o.push({x,y,temp,wind,wd})}return o},
   trueRaw:0,
   dag:{nodes:[{k:'temp',l:'Temperature',x:130,y:20},{k:'x',l:'Ice cream',x:20,y:100},{k:'y',l:'Rescues',x:240,y:100}],edges:[['temp','x',1],['temp','y',1]],note:'Hot days push up both ice cream sales and swimming. Ice cream has no effect on rescues.'}},
  {name:'Tutoring centre',N:300,
   X:{k:'x',n:'Tutoring hours',u:'h/week'},Y:{k:'y',n:'Exam score',u:'points'},
   brief:'A school asks whether tutoring improves exam scores. Students who attend more tutoring seem to score lower. Decide what to adjust for before you answer.',
   C:[{k:'prior',n:'Prior grade average',u:'z-score'},{k:'sleep',n:'Hours of sleep',u:'h'},{k:'cls',n:'Class size',u:'students'}],
   good:['prior'],
   gen(r){const o=[];for(let i=0;i<300;i++){const prior=r.n(),sleep=7+r.n(),cls=24+3*r.n();
     const x=5-1.8*prior+1.2*r.n(),y=60+1.5*x+8*prior+5*r.n();o.push({x,y,prior,sleep,cls})}return o},
   trueRaw:1.5,
   dag:{nodes:[{k:'prior',l:'Prior grades',x:130,y:20},{k:'x',l:'Tutoring',x:20,y:100},{k:'y',l:'Exam score',x:240,y:100}],edges:[['prior','x',1],['prior','y',1],['x','y',1]],note:'Weaker students take more tutoring, and weaker students score lower. Tutoring itself helps.'}},
  {name:'Fitness app',N:300,
   X:{k:'x',n:'App use',u:'h/week'},Y:{k:'y',n:'Resting heart rate',u:'bpm'},
   brief:'Does using a fitness app lower resting heart rate? You want the total effect of the app. Four other variables are on file. Some help, some mislead.',
   C:[{k:'age',n:'Age',u:'years'},{k:'work',n:'Weekly workouts',u:'sessions'},{k:'lead',n:'Leaderboard score',u:'points'},{k:'phone',n:'Phone model age',u:'years'}],
   good:['age'],
   gen(r){const o=[];for(let i=0;i<300;i++){const age=40+12*r.n(),phone=2+1*r.n();
     const x=6-0.12*(age-40)+1.5*r.n();
     const work=1+0.6*x+1*r.n();
     const y=68+0.25*(age-40)-0.3*x-1.0*work+3*r.n();
     const lead=0.5*(x-6)/1.5*1+0.5*(-(y-68)/3.2)+0.5*r.n();
     o.push({x,y,age,work,lead,phone})}return o},
   trueRaw:-0.9,
   dag:{nodes:[{k:'age',l:'Age',x:130,y:12},{k:'x',l:'App use',x:20,y:80},{k:'work',l:'Workouts',x:130,y:80},{k:'y',l:'Heart rate',x:240,y:130},{k:'lead',l:'Leaderboard',x:130,y:150}],edges:[['age','x',1],['age','y',1],['x','work',1],['work','y',1],['x','y',1],['x','lead',1],['y','lead',1]],note:'Age confounds. Workouts carry part of the effect (a mediator). The leaderboard is caused by both app use and heart rate (a collider). Adjusting for it creates a false link.'}}
];
function l4Reg(rows,xk,yk,ctl){
  // OLS of y on [1,x,controls]; returns coefficient for x
  const m=2+ctl.length,AtA=Array.from({length:m},()=>new Array(m).fill(0)),Aty=new Array(m).fill(0);
  for(const r of rows){const v=[1,r[xk],...ctl.map(c=>r[c])];for(let a=0;a<m;a++){Aty[a]+=v[a]*r[yk];for(let b=0;b<m;b++)AtA[a][b]+=v[a]*v[b]}}
  const c=solve(AtA,Aty);return c;
}
function corr(a,b){const ma=mean(a),mb=mean(b);let s=0,sa=0,sb=0;for(let i=0;i<a.length;i++){s+=(a[i]-ma)*(b[i]-mb);sa+=(a[i]-ma)**2;sb+=(b[i]-mb)**2}return s/Math.sqrt(sa*sb)}
function l4Analyse(cfg,rows,ctl){
  const xs=rows.map(r=>r.x),ys=rows.map(r=>r.y),k=sd(xs)/sd(ys);
  const naive=l4Reg(rows,'x','y',[])[1]/k*1; // placeholder, replaced below
  const nb=l4Reg(rows,'x','y',[])[1]*sd(xs)/sd(ys);
  const adj=l4Reg(rows,'x','y',ctl)[1]*sd(xs)/sd(ys);
  const tru=cfg.trueRaw*sd(xs)/sd(ys);
  const scale=Math.max(Math.abs(nb-tru),0.3*Math.abs(tru),0.1);
  const score=Math.round(100*clamp(1-Math.abs(adj-tru)/scale,0,1));
  return {r:corr(xs,ys),naive:nb,adj,tru,score,sdX:sd(xs),sdY:sd(ys)};
}

<script>
(function(){

function recordScore(score){
  const l=S.lvl,r=S.round;
  if(PR.first[l][r]==null)PR.first[l][r]=score;

/* ---------------- chart helpers ---------------- */
function niceTicks(lo,hi,k){

  const out=[];for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)out.push(+v.toFixed(6));return out;
}
function frame(W,H,m){return {W,H,m,iw:W-m.l-m.r,ih:H-m.t-m.b}}
const sx=(F,lo,hi)=>v=>F.m.l+(v-lo)/(hi-lo)*F.iw;
const sy=(F,lo,hi)=>v=>F.m.t+F.ih-(v-lo)/(hi-lo)*F.ih;
function axes(F,xs,ys,xt,yt,xl,yl,fmtx,fmty){

function l3Feedback(cfg){
  const x=S.x,ev=x.ev,row=ev.rows[x.deg-1],best=ev.best,score=l3Score(ev,x.deg);

  let t;
  if(over)t=`<p><strong>Overfitting.</strong> Training error fell to ${f2(row.train)}, but on fresh data the error is ${row.test>99?'over 99':f2(row.test)}. The curve memorised noise, so its predictions on new cases swing wildly. More flexibility lowers <em>bias</em> but raises <em>variance</em>, and with only ${ev.trX.length} points the variance wins.</p>`;
  else if(under)t=`<p><strong>Underfitting.</strong> Degree ${x.deg} is too stiff to follow the real pattern, so error on fresh data (${f2(row.test)}) stays above the best you could get (${f2(best.test)} at degree ${best.d}). That is bias: the model cannot bend enough.</p>`;
  else t=`<p><strong>Well balanced.</strong> Degree ${x.deg} gets ${f2(row.test)} on fresh data. The best possible here was ${f2(best.test)} at degree ${best.d}. The dashed line shows fresh-data error across all degrees: a U shape, while training error only ever falls.</p>`;
  if(x.hold)t+=`<p>You held out ${ev.vaX.length} points. ${ev.vaX.length<8?'With so few, the validation curve is noisy, but it still warned you about the extreme degrees.':'Its curve tracked the fresh-data curve, which is why validation works.'}</p>`;
  else t+=`<p>You did not hold out data, so training error was your only guide, and it always favours the most flexible model. Try ticking the validation box and resubmitting.</p>`;
  return `<div class="stack fade"><div class="tiles"><div class="tile"><div class="k">Fresh-data error</div><div class="v">${f2(row.test)}</div></div><div class="tile"><div class="k">Best possible</div><div class="v">${f2(best.test)}</div></div><div class="tile"><div class="k">Score</div><div class="v">${score}</div></div></div>

function l3Submit(){

function dagSVG(cfg){
  const W=360,H=190,bw=100,bh=30,N={};
  cfg.dag.nodes.forEach(n=>N[n.k]=n);
  const c=n=>({x:n.x+bw/2,y:n.y+bh/2});
  const clip=(n,from,to)=>{const a=c(n),dx=to.x-from.x,dy=to.y-from.y;const tx=dx?(bw/2+3)/Math.abs(dx):1e9,ty=dy?(bh/2+3)/Math.abs(dy):1e9;const t=Math.min(tx,ty);return {x:a.x,y:a.y,t}};
  let s=`<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--ink)"/></marker></defs>`;
  cfg.dag.edges.forEach(([a,b])=>{const A=c(N[a]),B=c(N[b]);const dx=B.x-A.x,dy=B.y-A.y;
    const ta=Math.min(dx?(bw/2+2)/Math.abs(dx):9,dy?(bh/2+2)/Math.abs(dy):9),tb=Math.min(dx?(bw/2+5)/Math.abs(dx):9,dy?(bh/2+5)/Math.abs(dy):9);
    s+=`<line x1="${A.x+dx*ta}" y1="${A.y+dy*ta}" x2="${B.x-dx*tb}" y2="${B.y-dy*tb}" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#ar)"/>`});
  cfg.dag.nodes.forEach(n=>{const special=n.k==='x'||n.k==='y';s+=`<rect x="${n.x}" y="${n.y}" width="${bw}" height="${bh}" rx="5" fill="${special?'var(--info-bg)':'var(--surface)'}" stroke="${special?'var(--accent)':'var(--line)'}" stroke-width="1.5"/><text x="${n.x+bw/2}" y="${n.y+19}" text-anchor="middle" style="fill:var(--ink)">${esc(n.l)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Causal diagram">${s}</svg>`;
}
function l4Update(){
  const cfg=LV[3].rounds[S.round],x=S.x,rows=x.rows,A=l4Analyse(cfg,rows,x.ctl);
  const F=frame(600,340,{l:46,r:12,t:10,b:40});
  const xs=rows.map(r=>r.x),ys=rows.map(r=>r.y),xl=Math.min(...xs),xh=Math.max(...xs),yl=Math.min(...ys),yh=Math.max(...ys);
  const X=sx(F,xl-(xh-xl)*.04,xh+(xh-xl)*.04),Y=sy(F,yl-(yh-yl)*.05,yh+(yh-yl)*.05);
  const g0=x.ctl[0];let cols=['var(--c1)'],grp=()=>0,cuts=null;
  if(g0){const v=rows.map(r=>r[g0]).sort((a,b)=>a-b);cuts=[v[Math.floor(v.length/3)],v[Math.floor(2*v.length/3)]];cols=['var(--c1)','var(--c3)','var(--c2)'];grp=r=>r[g0]<cuts[0]?0:(r[g0]<cuts[1]?1:2)}
  let s=axes(F,X,Y,niceTicks(xl,xh,6),niceTicks(yl,yh,5),`${cfg.X.n} (${cfg.X.u})`,`${cfg.Y.n} (${cfg.Y.u})`);
  rows.forEach(r=>{s+=`<circle cx="${X(r.x)}" cy="${Y(r.y)}" r="2.8" fill="${cols[grp(r)]}" opacity=".6"/>`});
  const lineFor=(sub,col)=>{const f=ols(sub.map(r=>r.x),sub.map(r=>r.y));if(!f)return '';const a=Math.min(...sub.map(r=>r.x)),b=Math.max(...sub.map(r=>r.x));return `<line x1="${X(a)}" y1="${Y(f.a+f.b*a)}" x2="${X(b)}" y2="${Y(f.a+f.b*b)}" stroke="${col}" stroke-width="3"/>`};
  if(g0){for(let k=0;k<3;k++)s+=lineFor(rows.filter(r=>grp(r)===k),cols[k])}else s+=lineFor(rows,'var(--ink)');
  const gname=g0?cfg.C.find(c=>c.k===g0).n:'';
  $('#l4viz').innerHTML=`<div class="legend">${g0?`<span>Colour = ${esc(gname)}:</span><span><span class="sw" style="background:var(--c1)"></span>lowest third</span><span><span class="sw" style="background:var(--c3)"></span>middle</span><span><span class="sw" style="background:var(--c2)"></span>highest third</span><span>Lines show the trend inside each group.</span>`:'<span>One line through everything. Tick a variable to split the data by it.</span>'}</div>
   <svg viewBox="0 0 ${F.W} ${F.H}" role="img" aria-label="Scatter plot of ${esc(cfg.Y.n)} against ${esc(cfg.X.n)}">${s}</svg>`;
  const sign=v=>v>=0?'+':'';
  $('#l4stats').innerHTML=`<div class="tiles"><div class="tile"><div class="k">Raw correlation</div><div class="v">${sign(A.r)}${f2(A.r)}</div></div><div class="tile"><div class="k">Effect after adjusting</div><div class="v">${sign(A.adj)}${f2(A.adj)}</div></div></div>
   <p class="tag" style="margin:6px 0 0">Effect = change in ${esc(cfg.Y.n)} (in standard deviations) when ${esc(cfg.X.n)} rises by one standard deviation.</p>`;
  if(x.done)$('#l4fb').innerHTML=l4Feedback(cfg,A);
}
function l4Feedback(cfg,A){
  const x=S.x,sign=v=>v>=0?'+':'';
  const picked=x.ctl,names=k=>cfg.C.find(c=>c.k===k).n;
  const rl=cfg.C.map(c=>{const on=picked.includes(c.k),[role,why]=ROLES[c.k],right=(role==='Confounder')===on||(role==='Unrelated');
    return `<li><b>${esc(c.n)}</b> <span class="pill ${role==='Confounder'?'g':(role==='Unrelated'?'':'b')}">${role}</span> ${on?'(you adjusted)':'(you did not)'}<br><span style="color:var(--muted)">${esc(why)}</span></li>`}).join('');
  const verdict=A.score>=80?'Your estimate is close to the real effect.':(A.score>=40?'Your estimate is partly right but off.':'Your estimate is far from the real effect.');
  return `<div class="stack fade"><div class="tiles"><div class="tile"><div class="k">Real effect</div><div class="v">${sign(A.tru)}${f2(A.tru)}</div></div><div class="tile"><div class="k">Your estimate</div><div class="v">${sign(A.adj)}${f2(A.adj)}</div></div><div class="tile"><div class="k">Score</div><div class="v">${A.score}</div></div></div>
   <div class="note ${A.score>=70?'g':'b'}"><p><strong>If the client acts on your advice.</strong> They lower ${esc(cfg.X.n)} by one standard deviation. You predicted ${esc(cfg.Y.n)} would change by <b>${sign(-A.adj)}${f2(-A.adj)}</b> SD. In reality it changes by <b>${sign(-A.tru)}${f2(-A.tru)}</b> SD. ${verdict}</p><p style="margin:0">The raw correlation was ${sign(A.r)}${f2(A.r)}. ${A.r*A.tru<0?'It even had the opposite sign to the real effect.':(Math.abs(A.tru)<0.1?'The real effect is about zero.':'Confounding exaggerated it.')}</p></div>
   <div><h3 style="margin-bottom:6px">What was really going on</h3>${dagSVG(cfg)}<p style="margin-top:6px">${esc(cfg.dag.note)}</p></div>
   <ul class="clean" style="font-size:.9rem">${rl}</ul>
   <div class="btnrow">${nextBtn()}</div>${learnTrack()}</div>`;
}
function l4Submit(){
  const cfg=LV[3].rounds[S.round],x=S.x,A=l4Analyse(cfg,x.rows,x.ctl);
  x.done=true;recordScore(A.score);
  if(x.ctl.includes(cfg.good[0])&&A.score>=75)disc('conf');
  if(x.ctl.some(k=>['Mediator','Collider'].includes(ROLES[k][0])))disc('trap');
  l4Update();$('#l4fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ---------------- docs / report / playtest ---------------- */
function howHTML(){
  const steps=[['Present a real problem','Every round opens a client brief built around a dataset the game generates fresh for you, so no two plays are the same.'],
   ['Make a decision','You choose a sampling method, which records to remove, how flexible a model should be, or which variables to adjust for.'],
   ['Calculate the consequences','Your choice is run on the data right then: random draws, a regression, a polynomial fit. Nothing is a stored answer.'],
   ['Get immediate feedback','You see what happened, with charts and numbers, and a plain explanation of the data science idea behind it.'],
   ['Face harder data','Each case has three rounds. Budgets shrink, noise grows, groups get smaller and traps get subtler.'],
   ['Measure your learning','Your first attempt each round is your learning score. The Learning report tracks how those scores change from round 1 to round 3.']];
  return `<div class="stack"><div class="card"><h2>How to play</h2><p style="margin-top:8px">You are a junior analyst with four case files. In each one a client wants an answer, the data is messy, and your decisions decide whether the answer is right. You learn the idea by seeing what your own choice does, not by reading about it.</p></div>
  <div class="steps">${steps.map(s=>`<div class="card"><h3>${s[0]}</h3><p style="margin:6px 0 0;color:var(--muted)">${s[1]}</p></div>`).join('')}</div>
  <div class="card stack"><h3>Rules and scoring</h3><ul class="clean">
   <li><b>Goal:</b> get as close as you can to the truth hidden in each dataset. Every round gives a score from 0 to 100.</li>
   <li><b>First try counts.</b> In Cases 1 and 3 you may experiment again after feedback. In Cases 2 and 4 you submit once. Only the first attempt is your learning score, so use retries to explore, not to farm points.</li>
   <li><b>Unlocking:</b> finish all three rounds of a case to open the next. Teacher mode on the Play page opens everything.</li>
   <li><b>Sampling:</b> score drops with the typical error of your design across 400 repeats. Bias and wide spread both cost points.</li>
   <li><b>Outliers:</b> score rewards a slope close to the truth, loses 12 for each genuine record you remove and 15 for each error you leave in. You can check paperwork on only a few sales.</li>
   <li><b>Overfitting:</b> score compares your model's error on fresh data with the best available degree.</li>
   <li><b>Causation:</b> score compares your adjusted effect with the real one, and shows what would happen if the client acted on your advice.</li></ul></div>
  <div class="card"><h3>Tips</h3><ul class="clean"><li>On a phone, tap rows in the sales table if dots are hard to hit.</li><li>Progress is saved in this browser.</li><li>Colours are paired with labels and shapes, so the charts do not depend on colour alone.</li></ul></div></div>`;
}
function objHTML(){
  const gl=[['Population and sample','Everyone you want to know about, and the part of them you actually measure.'],
   ['Selection bias','A sampling method that systematically over- or under-represents some people, so the estimate is off in a consistent direction.'],
   ['Sampling variance','Random scatter between samples. It shrinks as the sample grows but cannot repair bias.'],
   ['Stratified sampling','Split the population into groups and sample inside each, so every group is represented in proportion.'],
   ['Outlier vs error','An outlier is an unusual value. An error is a wrong value. Only evidence about how the record arose tells them apart.'],
   ['Leverage','How far a point sits from the others along the x-axis. High-leverage points can pull a fitted line strongly.'],
   ['Overfitting','A model so flexible that it fits noise in the training data and predicts new data badly.'],
   ['Bias–variance trade-off','Simple models are stiff (high bias, low variance). Flexible models wiggle with the data (low bias, high variance).'],
   ['Validation set','Data kept out of training, used to estimate how the model will do on new cases.'],
   ['Confounder','A variable that influences both the cause and the effect, creating or hiding a relationship.'],
   ['Mediator','A variable on the path from cause to effect. Adjusting for it removes part of the effect.'],
   ['Collider','A variable caused by both the cause and the effect. Adjusting for it creates a false link.'],
   ['Correlation vs causation','Two variables moving together does not mean one changes the other. A causal claim needs the right adjustment or an experiment.']];
  return `<div class="stack"><div class="card"><h2>Learning objectives</h2><p style="margin-top:8px">Four concepts, each taught by a decision whose result is computed live. A learner who finishes the game can do the following.</p></div>
  ${LV.map((v,i)=>`<div class="card"><span class="tag">Case ${i+1} · ${esc(v.role)}</span><h3 style="margin:4px 0 8px">${esc(v.concept)}</h3><ul class="clean">${v.los.map(l=>`<li>${esc(l)}</li>`).join('')}</ul><p class="tag" style="margin:10px 0 0">Assessed by: the first-try score in each of three rounds</p></div>`).join('')}
  <div class="card"><h3 style="margin-bottom:10px">Key terms</h3><dl class="gl">${gl.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join('')}</dl></div></div>`;
}
function bars(arr){
  return `<div style="display:flex;gap:14px;align-items:flex-end;height:110px">${[0,1,2].map(r=>{const v=arr[r];return `<div style="flex:1;display:grid;gap:4px;justify-items:center;align-content:end;height:100%"><span class="mono" style="font-size:.8rem">${v==null?'–':v}</span><div style="width:100%;max-width:70px;height:${v==null?2:Math.max(3,v*0.8)}px;background:${v==null?'var(--line)':'var(--c1)'};border-radius:3px 3px 0 0"></div><span class="tag">R${r+1}</span></div>`}).join('')}</div>`;
}
function reportHTML(){
  const played=PR.first.flat().filter(v=>v!=null);
  const avg=played.length?Math.round(mean(played)):null;
  const cards=LV.map((v,i)=>{
    const a=PR.first[i],p=a.filter(x=>x!=null),d=p.length>=2?p[p.length-1]-p[0]:null;
    const status=p.length<3?'In progress':(a[2]>=75?'Concept secured':(a[2]>=50?'Getting there':'Needs another pass'));
    return `<div class="card stack"><div><span class="tag">Case ${i+1}</span><h3>${esc(v.concept)}</h3></div>${bars(a)}
      <div class="tag">${d==null?'Play two rounds to see a trend.':'Change from first to latest round: <b class="'+(d>=0?'good':'bad')+'">'+(d>=0?'+':'')+d+'</b>'}</div><span class="pill ${status==='Concept secured'?'g':''}">${status}</span></div>`}).join('');
  const dl=Object.keys(DISC).map(k=>`<li style="${PR.disc[k]?'':'opacity:.5'}">${PR.disc[k]?'✓ ':'○ '}${esc(DISC[k])}</li>`).join('');
  return `<div class="stack"><div class="card"><h2>Learning report</h2><p style="margin-top:8px">Bars show your <b>first-try</b> score in each round, the decision you made before seeing any feedback. Rising bars within a case mean the earlier feedback changed how you decide.</p>
   <div class="tiles" style="margin-top:10px"><div class="tile"><div class="k">Rounds played</div><div class="v">${played.length}/12</div></div><div class="tile"><div class="k">Average first try</div><div class="v">${avg==null?'–':avg}</div></div></div></div>
   <div class="rail" style="margin:0">${cards}</div>
   <div class="card"><h3 style="margin-bottom:6px">Ideas you have run into</h3><ul class="clean" style="list-style:none;padding:0">${dl}</ul></div>
   <div class="btnrow"><button class="btn ghost" data-act="reset">Reset my progress</button></div></div>`;
}
function ptList(){return load('dd-playtests',[])}
function playtestHTML(){
  const L=ptList(),note=load('dd-changes','');
  const played=PR.first.flat().filter(v=>v!=null),avg=played.length?Math.round(mean(played)):'';
  const stat=L.length?`<div class="tiles"><div class="tile"><div class="k">Testers</div><div class="v">${L.length}</div></div><div class="tile"><div class="k">Avg fun</div><div class="v">${f1(mean(L.map(e=>+e.fun||0)))}</div></div><div class="tile"><div class="k">Avg clarity</div><div class="v">${f1(mean(L.map(e=>+e.clear||0)))}</div></div><div class="tile"><div class="k">Avg first-try</div><div class="v">${f0(mean(L.map(e=>+e.avg||0)))}</div></div></div>`:'<p class="tag">No entries yet.</p>';
  return `<div class="stack"><div class="card stack"><h2>Playtest evidence</h2>
   <p>Ask a few peers to play at least one full case while you watch without helping. Record what they did and said below. Entries are saved in this browser, so use the same device for each tester, or have them copy their entry and paste it into the box further down on your device.</p>
   <ol class="clean"><li>Hand over the game with no explanation beyond the page title.</li><li>Note where they hesitate or ask a question. Those are design bugs.</li><li>Ask what they now understand that they did not before.</li><li>Record the entry, then change the game and note what you changed.</li></ol></div>
  <div class="card stack"><h3>New entry</h3>
   <div class="work" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
    <label class="f">Tester (initials or first name)<input type="text" id="pt-name" autocomplete="off"></label>
    <label class="f">Average first-try score in this browser<input type="text" id="pt-avg" value="${avg}" inputmode="numeric"></label>
    <label class="f">Fun (1 to 5)<select id="pt-fun"><option>3</option><option>1</option><option>2</option><option>4</option><option>5</option></select></label>
    <label class="f">Clarity of instructions (1 to 5)<select id="pt-clear"><option>3</option><option>1</option><option>2</option><option>4</option><option>5</option></select></label></div>
   <label class="f">What did they learn by playing?<textarea id="pt-learn"></textarea></label>
   <label class="f">Where were they confused or stuck?<textarea id="pt-stuck"></textarea></label>
   <div class="btnrow"><button class="btn" data-act="ptsave">Save entry</button><button class="btn ghost" data-act="ptcopy">Copy entry as text</button></div><div id="pt-msg" class="tag"></div></div>
  <div class="card stack"><h3>Results so far</h3>${stat}
   ${L.length?`<div class="tablewrap" style="max-height:none"><table><thead><tr><th>Tester</th><th>First try</th><th>Fun</th><th>Clear</th><th>Learned</th><th>Stuck on</th></tr></thead><tbody>${L.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.avg)}</td><td>${esc(e.fun)}</td><td>${esc(e.clear)}</td><td>${esc(e.learn)}</td><td>${esc(e.stuck)}</td></tr>`).join('')}</tbody></table></div>
   <div class="btnrow"><button class="btn ghost" data-act="ptcopyall">Copy table as text</button><button class="btn ghost" data-act="ptclear">Clear all entries</button></div>`:''}
   <label class="f" style="margin-top:6px">Entries pasted from other devices (one per line)<textarea id="pt-import" placeholder="Paste copied entries here"></textarea></label><div class="btnrow"><button class="btn ghost" data-act="ptimport">Add pasted entries</button></div></div>
  <div class="card stack"><h3>What I changed after playtesting</h3><textarea id="pt-changes" placeholder="Example: testers did not notice the validation checkbox, so I added a line under the chart pointing to it.">${esc(note)}</textarea><div class="tag">Saved as you type.</div></div></div>`;
}
function ptEntry(){
  return {name:($('#pt-name').value||'Anonymous').trim(),avg:($('#pt-avg').value||'').trim(),fun:$('#pt-fun').value,clear:$('#pt-clear').value,learn:($('#pt-learn').value||'').trim(),stuck:($('#pt-stuck').value||'').trim()};
}
function copyText(t,msgEl){
  const done=ok=>{if(msgEl)msgEl.textContent=ok?'Copied to clipboard.':'Select and copy the text from the box that appeared.'};
  try{navigator.clipboard.writeText(t).then(()=>done(true),()=>fallbackCopy(t,msgEl))}catch(e){fallbackCopy(t,msgEl)}
}
function fallbackCopy(t,msgEl){
  if(!msgEl)return;
  msgEl.innerHTML='Select and copy:<textarea readonly style="margin-top:6px">'+esc(t)+'</textarea>';
  const ta=msgEl.querySelector('textarea');ta.focus();ta.select();
}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,x=S.x;
  if(a==='view')return setView(el.dataset.v);
  if(a==='level')return openLevel(+el.dataset.l);
  if(a==='unlock'){PR.unlockAll=!PR.unlockAll;saveP();return render()}
  if(a==='start'){S.phase='play';initRound();return render()}
  if(a==='next'){S.round++;initRound();return render()}
  if(a==='finish'){return setView('report')}
  if(a==='run1')return l1Run_();
  if(a==='again1'){x.res=null;x.method=null;S.phase='play';render();return}
  if(a==='pick'){x.sel=+el.dataset.id;return l2Update()}
  if(a==='inv'){const p=x.D.pts.find(q=>q.id===x.sel);if(p&&x.left>0&&!x.known.has(p.id)){x.known.add(p.id);x.left--}return l2Update()}
  if(a==='rem'){if(x.removed.has(x.sel))x.removed.delete(x.sel);else x.removed.add(x.sel);return l2Update()}
  if(a==='sub2')return l2Submit();
  if(a==='sub3')return l3Submit();
  if(a==='again3'){x.sub=false;l3Update();return}
  if(a==='sub4')return l4Submit();
  if(a==='reset'){if(el.dataset.sure){PR.first=[[],[],[],[]];PR.best=[[],[],[],[]];PR.disc={};saveP();S.phase='intro';return render()}el.dataset.sure='1';el.textContent='Click again to erase all progress';return}
  if(a==='ptsave'){const en=ptEntry();const L=ptList();L.push(en);save('dd-playtests',L);return render()}
  if(a==='ptcopy'){return copyText('DDC|'+JSON.stringify(ptEntry()),$('#pt-msg'))}
  if(a==='ptcopyall'){const L=ptList();return copyText(L.map(en=>'DDC|'+JSON.stringify(en)).join('\n'),null)}
  if(a==='ptclear'){if(el.dataset.sure){save('dd-playtests',[]);return render()}el.dataset.sure='1';el.textContent='Click again to delete all entries';return}
  if(a==='ptimport'){const L=ptList();($('#pt-import').value||'').split('\n').forEach(line=>{const m=line.trim().replace(/^DDC\|/,'');if(!m)return;try{const o=JSON.parse(m);if(o&&typeof o==='object')L.push({name:String(o.name||''),avg:String(o.avg||''),fun:String(o.fun||''),clear:String(o.clear||''),learn:String(o.learn||''),stuck:String(o.stuck||'')})}catch(err){}});save('dd-playtests',L);return render()}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset&&t.dataset.act;
  if(a==='method'){S.x.method=t.value;const b=$('#runbtn');if(b)b.disabled=false}
  if(a==='ctl'){const c=S.x.ctl,i=c.indexOf(t.value);if(t.checked&&i<0)c.push(t.value);if(!t.checked&&i>=0)c.splice(i,1);l4Update()}
  if(t.id==='holdbox'){S.x.hold=t.checked;S.x.ev=l3Eval(LV[2].rounds[S.round],S.x.D,S.x.hold,12);l3Update()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='nrange'){S.x.n=+t.value;$('#nval').textContent=t.value}
  if(t.id==='degr'){S.x.deg=+t.value;$('#degv').textContent=t.value;l3Update()}
  if(t.id==='pt-changes')save('dd-changes',t.value);
});

/* ---------------- boot ---------------- */
(function(){
  const v=(location.hash||'').slice(1);if(VIEWS.some(a=>a[0]===v))S.view=v;
  render();
})();
})();
